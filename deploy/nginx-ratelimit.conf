# /parts-as/ 봇 트래픽 완화용 레이트리밋 존 (http 컨텍스트)
# 적용 위치: /etc/nginx/conf.d/ratelimit.conf  (nginx.conf 의 http{} 가 conf.d/*.conf 를 include)
#
# IP당 분당 10회(rate=10r/m ≈ 6초당 1회). zone 메모리 10m ≈ 약 16만 IP 추적.
# 실제 제한 적용(limit_req)은 server 블록의 `location ^~ /parts-as/` 에서 한다.
limit_req_zone $binary_remote_addr zone=parts_as_limit:10m rate=10r/m;
