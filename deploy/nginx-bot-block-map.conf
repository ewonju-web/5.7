# nginx http {} 블록에 include (예: /etc/nginx/conf.d/bot-block-map.conf)
# map은 server 블록 밖(http 컨텍스트)에 있어야 합니다.
map $http_user_agent $block_aggressive_bot {
    default 0;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*CCBot 1;
    ~*Bytespider 1;
    ~*SemrushBot 1;
    ~*AhrefsBot 1;
    ~*DotBot 1;
    ~*MJ12bot 1;
    ~*PetalBot 1;
}
