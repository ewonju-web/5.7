# /etc/nginx/sites-available/excavator
# 적용: sudo cp /srv/excavator/deploy/nginx-excavator.conf /etc/nginx/sites-available/excavator && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 61.111.38.50 direct-nara.co.kr www.direct-nara.co.kr;
    client_max_body_size 100M;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        alias /srv/excavator/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/excavator/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /main/main.html { return 301 /; }
    location = /viewsale/viewsale_010100.html { return 301 /; }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
