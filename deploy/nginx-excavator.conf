# /etc/nginx/sites-available/excavator
# 적용: sudo cp /srv/excavator/deploy/nginx-excavator.conf /etc/nginx/sites-available/excavator && sudo nginx -t && sudo systemctl reload nginx
#
# 필요한 http 컨텍스트 설정(conf.d):
#   - conf.d/ratelimit.conf      : limit_req_zone parts_as_limit (레이트리밋 존)
#   - conf.d/bot-block-map.conf  : map $block_aggressive_bot (공격적 봇 차단)

# ── 메인 서버 (HTTPS / 443, Certbot) — 정규(canonical) 호스트: non-www ──
server {
    server_name 61.111.38.50 direct-nara.co.kr;
    client_max_body_size 100M;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        alias /srv/excavator/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 핫링크 차단: 이미지 파일은 자사 도메인 또는 직접 접근(Referer 없음)만 허용.
    # 외부 사이트에서 <img src>로 직접 끌어다 쓰는 무단 사용은 403.
    # (정규식 location 이라 아래 prefix /media/ 보다 우선 적용됨)
    location ~* ^/media/.+\.(jpg|jpeg|png|gif|webp)$ {
        # server_names 가 이미 자사 도메인(direct-nara.co.kr, www, IP)을 포함하므로
        # 명시적으로 다시 적지 않는다. 와일드카드와 중복되면 nginx 가
        # "conflicting parameter" 로 설정 로드를 거부함.
        valid_referers none blocked server_names
            *.direct-nara.co.kr;
        if ($invalid_referer) {
            return 403;
        }
        root /srv/excavator;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/excavator/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 레거시(구버전) URL → 신버전 301 리다이렉트는 Django(config/urls.py)에서 일괄 처리한다.
    # nginx 에서 가로채면 ?uid= 등 쿼리 기반 매핑이 동작하지 않으므로 여기서는 처리하지 않는다.

    # 공격적 AI/SEO 봇은 Gunicorn까지 보내지 않음 (deploy/nginx-bot-block-map.conf 필요)
    if ($block_aggressive_bot) {
        return 403;
    }

    # ── 봇 트래픽 완화: /parts-as/ (및 하위 경로) IP당 분당 10회 제한 ──
    # zone 정의: conf.d/ratelimit.conf 의 limit_req_zone (rate=10r/m).
    # burst=5 nodelay → 일반 사용자(페이지 단건 로딩)는 영향 없고, 초과 시 429 반환.
    # 정적/미디어 자원은 /static/, /media/ location 으로 분리되어 본 제한과 무관.
    #
    # [레이트리밋 제외 경로] 아래는 /parts-as/ 하위가 아니므로 이 제한을 받지 않음:
    #   · 소셜 로그인 콜백: /accounts/{kakao,naver,google}/login/callback/
    #   · 결제 웹훅:        /billing/webhook/toss/
    location ^~ /parts-as/ {
        limit_req zone=parts_as_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/direct-nara.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/direct-nara.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── www(HTTPS) → non-www 301 (SEO 정규화: 중복 콘텐츠 방지) ──
# 인증서는 direct-nara.co.kr + www.direct-nara.co.kr 둘 다 포함하므로 동일 cert 사용.
server {
    listen 443 ssl;
    server_name www.direct-nara.co.kr;

    ssl_certificate /etc/letsencrypt/live/direct-nara.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/direct-nara.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://direct-nara.co.kr$request_uri;
}

# ── HTTP(80) → HTTPS non-www 301 (www·non-www·IP 모두 한 번에 정규 호스트로) ──
server {
    listen 80;
    server_name 61.111.38.50 direct-nara.co.kr www.direct-nara.co.kr;
    return 301 https://direct-nara.co.kr$request_uri;
}
