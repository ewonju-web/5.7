{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                <div class="card-body p-5">
                    <h2 class="fw-bold mb-2 text-center" style="color: var(--gn-text); font-size: 1.35rem;">비밀번호 설정</h2>
                    <p class="text-muted small text-center mb-4">
                        아이디 <strong>{{ user.username }}</strong>에 로그인 비밀번호를 설정합니다.
                        {% if has_social_account %}
                        설정 후에도 카카오·네이버·구글 로그인은 그대로 이용할 수 있습니다.
                        {% endif %}
                    </p>
                    <form method="post" action="{% url 'account_set_password' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">새 비밀번호 (8자 이상)</label>
                            <input type="password" name="password1" class="form-control" placeholder="새 비밀번호" required minlength="8" autocomplete="new-password" style="border-radius: 10px;">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">새 비밀번호 확인</label>
                            <input type="password" name="password2" class="form-control" placeholder="새 비밀번호 확인" required minlength="8" autocomplete="new-password" style="border-radius: 10px;">
                        </div>
                        <button type="submit" class="btn w-100 fw-bold py-2 text-dark mb-2" style="background: var(--gn-accent); border-radius: 10px;">비밀번호 설정</button>
                    </form>
                    <p class="text-center text-muted small mb-0">
                        <a href="{% url 'my_page' %}" class="text-muted">마이페이지로 돌아가기</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
