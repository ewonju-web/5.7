<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>요청이 너무 많습니다 | 굴삭기나라</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f8fafc; color: #1f2937; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.06); max-width: 460px; width: 100%; padding: 40px 28px; text-align: center; }
    .icon { font-size: 44px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 12px; }
    p { color: #4b5563; line-height: 1.6; margin: 0 0 22px; font-size: .96rem; }
    .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">⏳</div>
      <h1>요청이 너무 많습니다</h1>
      <p>
        짧은 시간에 너무 많은 요청이 감지되었습니다.<br>
        잠시 후(약 1분 뒤) 다시 시도해 주세요.
      </p>
      <a class="btn" href="/">메인으로 이동</a>
    </div>
  </div>
</body>
</html>
