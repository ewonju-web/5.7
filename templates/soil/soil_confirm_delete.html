{% extends "base.html" %}
{% load i18n_extras %}
{% block content %}
<div class="container py-4" style="max-width: 480px;">
    <div class="card border shadow-sm p-4" style="border-radius: 10px;">
        <h5 class="fw-bold mb-3">{{ LANG|tr:"soil_delete_confirm" }}</h5>
        <p class="text-muted small mb-4">{{ post.title }}</p>
        <form method="post" action="">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">{{ LANG|tr:"btn_delete" }}</button>
                <a href="{% url 'soil_detail' post.pk %}" class="btn btn-outline-secondary">{{ LANG|tr:"btn_cancel" }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
