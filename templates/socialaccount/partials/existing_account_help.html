{% url 'socialaccount_connections' as gn_social_connect_path %}
<div class="gn-existing-account-help border rounded-3 p-3 mt-2 mb-0" style="background: #f0f9ff; border-color: #bae6fd !important;">
    <p class="small fw-semibold mb-1" style="color: #0c4a6e;">이미 가입하신 계정이 있으신가요?</p>
    <p class="small text-muted mb-2 mb-md-3">여기서 다른 아이디·이메일로 가입하면 <strong>새 계정이 따로</strong> 만들어질 수 있습니다. 기존 아이디로 로그인한 뒤 소셜 계정을 연결해 주세요.</p>
    <a href="{% url 'login' %}?next={{ gn_social_connect_path|urlencode }}"
       class="btn btn-sm w-100 fw-bold"
       style="background: #fff; border: 1px solid #0ea5e9; color: #0369a1; border-radius: 10px;">
        기존 계정으로 로그인 후 연결하기
    </a>
</div>
