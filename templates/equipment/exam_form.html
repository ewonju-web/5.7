{% extends "base.html" %}
{% load static i18n_extras %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/jobs.css' %}?v=20260527d">
{% endblock %}
{% block content %}
<div class="container py-4 job-list-page-v2">
    <div class="job-list-shell rounded-3 px-2 px-md-3 py-3 py-md-4" style="max-width: 720px; margin: 0 auto;">
        <h2 class="job-page-heading mb-4">
            <span class="job-page-heading-bar" aria-hidden="true"></span>
            자격증 시험 글쓰기
        </h2>
        <form method="post" enctype="multipart/form-data" class="job-search-panel border rounded-3 bg-white p-3 p-md-4" id="exam-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="exam-title" class="form-label small fw-bold">제목</label>
                <input type="text" id="exam-title" name="title" class="form-control job-select-rounded" maxlength="200" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="exam-equipment" class="form-label small fw-bold">기종</label>
                    <select id="exam-equipment" name="equipment" class="form-select job-select-rounded" required>
                        <option value="">선택</option>
                        {% for val, label in exam_equipment_choices %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="exam-category" class="form-label small fw-bold">유형</label>
                    <select id="exam-category" name="category" class="form-select job-select-rounded" required>
                        <option value="">선택</option>
                        {% for val, label in exam_category_choices %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div id="exam-review-hint" class="alert alert-light border small mb-3" style="display: none;" role="status">
                합격 후기를 남겨주시면 다른 수험생들이 댓글로 소통할 수 있어요 😊
            </div>
            <div id="youtube-url-wrap" class="mb-3" style="display: none;">
                <label for="exam-youtube-url" class="form-label small fw-bold">유튜브 URL <span class="text-danger">*</span></label>
                <input type="url" id="exam-youtube-url" name="youtube_url" class="form-control job-select-rounded" placeholder="예: https://www.youtube.com/watch?v=xxxxx">
            </div>
            <div class="mb-3">
                <label for="exam-content" class="form-label small fw-bold" id="exam-content-label">내용</label>
                <textarea id="exam-content" name="content" class="form-control job-select-rounded" rows="10"></textarea>
            </div>
            <div class="mb-4" id="exam-file-wrap">
                <label for="exam-file" class="form-label small fw-bold">첨부 파일 <span class="text-muted fw-normal">(선택)</span></label>
                <input type="file" id="exam-file" name="file" class="form-control">
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="job-btn-search-light">등록</button>
                <a href="{% url 'exam_list' %}" class="job-btn-reset-light">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
    function initExamFormCategoryUI() {
        var categorySelect = document.querySelector('#exam-form [name="category"]');
        var youtubeWrap = document.getElementById('youtube-url-wrap');
        var youtubeInput = youtubeWrap ? youtubeWrap.querySelector('input[name="youtube_url"]') : null;
        var reviewHint = document.getElementById('exam-review-hint');
        var contentLabel = document.getElementById('exam-content-label');
        var contentField = document.getElementById('exam-content');

        function toggleYoutube() {
            if (!categorySelect || !youtubeWrap) return;
            if (categorySelect.value === 'video') {
                youtubeWrap.style.display = 'block';
                if (youtubeInput) youtubeInput.required = true;
            } else {
                youtubeWrap.style.display = 'none';
                if (youtubeInput) {
                    youtubeInput.required = false;
                    youtubeInput.value = '';
                }
            }
        }

        function syncCategoryUI() {
            var val = categorySelect ? categorySelect.value : '';
            toggleYoutube();
            if (reviewHint) reviewHint.style.display = val === 'review' ? 'block' : 'none';
            if (contentLabel) {
                contentLabel.textContent = val === 'video' ? '설명 (선택)' : '내용';
            }
            if (contentField) {
                contentField.required = val !== 'video';
                contentField.placeholder = val === 'video' ? '동영상에 대한 설명을 입력하세요. (선택)' : '';
            }
        }

        if (!categorySelect) return;
        categorySelect.addEventListener('change', syncCategoryUI);
        syncCategoryUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initExamFormCategoryUI);
    } else {
        initExamFormCategoryUI();
    }
})();
</script>
{% endblock %}
