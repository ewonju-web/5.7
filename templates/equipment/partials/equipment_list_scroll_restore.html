<script>
(function gnEqListScrollRestore() {
  if (!document.querySelector('[data-gn-list-restore]')) return;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var PENDING_KEY = 'gnEqListState:pending';
  var INDEX_QUERY_KEYS = [
    'category', 'expand', 'q', 'maker', 'sub_type', 'weight_class', 'model',
    'year_min', 'year_max', 'region_sido', 'region_sigungu', 'mast_type',
    'sort', 'premium_only'
  ];

  function canonicalQuery(search) {
    var raw = new URLSearchParams(search || '');
    var pairs = [];
    INDEX_QUERY_KEYS.forEach(function(key) {
      if (raw.has(key)) pairs.push([key, raw.get(key)]);
    });
    pairs.sort(function(a, b) { return a[0].localeCompare(b[0]); });
    var clean = new URLSearchParams();
    pairs.forEach(function(p) { clean.set(p[0], p[1]); });
    return clean.toString();
  }

  function isEquipmentDetailPath(pathname) {
    return /\/equipment\/\d+\/?$/.test(pathname || '');
  }

  function isVisibleEl(el) {
    if (!el || !el.getBoundingClientRect) return false;
    var rect = el.getBoundingClientRect();
    if (rect.width <= 0 && rect.height <= 0) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    return true;
  }

  function findEquipmentCard(equipmentId) {
    var nodes = document.querySelectorAll('[data-equipment-id="' + equipmentId + '"]');
    for (var i = 0; i < nodes.length; i++) {
      if (isVisibleEl(nodes[i])) return nodes[i];
    }
    return nodes[0] || null;
  }

  function saveEqListState(link) {
    try {
      var url = new URL(link.href, window.location.origin);
      if (url.origin !== window.location.origin) return;
      var m = url.pathname.match(/\/equipment\/(\d+)\/?$/);
      if (!m) return;
      var controls = document.querySelector('.gn-more-controls[data-offset]');
      var state = {
        listPath: window.location.pathname,
        listSearch: window.location.search || '',
        scrollY: window.scrollY || 0,
        equipmentId: m[1],
        offset: controls ? (parseInt(controls.getAttribute('data-offset'), 10) || 0) : 0
      };
      sessionStorage.setItem(PENDING_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function scrollToState(state) {
    if (!state) return false;
    if (state.equipmentId) {
      var card = findEquipmentCard(state.equipmentId);
      if (card) {
        card.scrollIntoView({ block: 'center', behavior: 'auto' });
        return true;
      }
    }
    var y = parseInt(state.scrollY, 10);
    if (!isNaN(y) && y >= 0) {
      window.scrollTo(0, y);
      return true;
    }
    return false;
  }

  function fineScroll(state) {
    if (scrollToState(state)) return;
    requestAnimationFrame(function() { scrollToState(state); });
    setTimeout(function() { scrollToState(state); }, 80);
  }

  function restoreEqListState() {
    var raw = sessionStorage.getItem(PENDING_KEY);
    if (!raw) return;
    var state;
    try { state = JSON.parse(raw); } catch (e) { return; }
    if (!state || state.listPath !== window.location.pathname) return;
    if (canonicalQuery(state.listSearch) !== canonicalQuery(window.location.search)) return;

    sessionStorage.removeItem(PENDING_KEY);

    var y = parseInt(state.scrollY, 10);
    if (!isNaN(y) && y > 0) {
      window.scrollTo(0, y);
    }

    var controls = document.querySelector('.gn-more-controls[data-offset]');
    var targetOffset = parseInt(state.offset, 10) || 0;
    var currentOffset = controls ? (parseInt(controls.getAttribute('data-offset'), 10) || 0) : 0;

    if (!controls || targetOffset <= currentOffset) {
      fineScroll(state);
      return;
    }

    function loadUntilOffset() {
      var cur = parseInt(controls.getAttribute('data-offset'), 10) || 0;
      var total = parseInt(controls.getAttribute('data-total'), 10) || 0;
      if (cur >= targetOffset || cur >= total) {
        fineScroll(state);
        return;
      }
      var loader = window.gnIndexLoadMoreOnce;
      if (typeof loader !== 'function') {
        fineScroll(state);
        return;
      }
      var need = Math.min(targetOffset - cur, 200, total - cur);
      loader({ perPage: need, silent: true }).then(function() {
        loadUntilOffset();
      }).catch(function() {
        fineScroll(state);
      });
    }
    loadUntilOffset();
  }

  document.addEventListener('click', function(e) {
    if (e.defaultPrevented || e.button !== 0) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var link = e.target.closest('a[href]');
    if (!link) return;
    if (link.closest('[href*="favorite"]')) return;
    try {
      var url = new URL(link.href, window.location.origin);
      if (!isEquipmentDetailPath(url.pathname)) return;
    } catch (err) { return; }
    saveEqListState(link);
  }, true);

  restoreEqListState();
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) restoreEqListState();
  });
})();
</script>
